name: Élève virtuel (Playwright)
on:
  pull_request:
  workflow_dispatch:
jobs:
  virtual-student:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Captures et traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: virtual-student-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
