name: Audit mathematique 65 modules
on:
  push:
    branches:
      - audit-maths-phase2-regression-review
  workflow_dispatch:
    inputs:
      rounds:
        description: Nombre de tirages reproductibles par module
        required: true
        default: '30'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit des questions et de la couverture
        continue-on-error: true
        env:
          AUDIT_ROUNDS: ${{ inputs.rounds }}
          AUDIT_TARGET: '65'
        run: node tests/audit-maths-65.cjs
      - name: Oracles independants phase 2
        continue-on-error: true
        env:
          AUDIT_ROUNDS: ${{ inputs.rounds }}
        run: node tests/audit-maths-phase2.cjs
      - name: Tests d'equations existants
        run: node --test tests/equations.test.cjs
      - name: Publier le rapport (meme si audit incomplet)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-maths-65-report
          path: audit-reports/
      - name: Refuser une couverture mathematique incomplete
        run: node -e "const r=require('./audit-reports/math-audit.json');const p=require('./audit-reports/math-phase2.json');if(r.catalogueCount!==65||r.fullyVerified!==65||r.totals.failed||Object.values(p.counts).some(c=>c.failed>0||c.unverified>0||c.verified===0))process.exit(1)"
