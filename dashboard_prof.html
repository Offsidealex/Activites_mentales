<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Prof — Activités Mentales</title>
<style>
  :root {
    --bg: #0f0f1a;
    --surface: #16213e;
    --border: #1e3a6e;
    --accent: #e94560;
    --accent2: #0f3460;
    --text: #e0e0e0;
    --text-muted: #888;
    --green: #4caf50;
    --yellow: #ffb300;
    --red: #e94560;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

  /* LOGIN */
  #login-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  #login-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 2.5rem 2rem; max-width: 340px; width: 90%;
    text-align: center;
  }
  #login-box h1 { font-size: 1.3rem; color: var(--accent); margin-bottom: 0.3rem; }
  #login-box p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
  #login-box input {
    width: 100%; padding: 0.75rem 1rem;
    background: var(--accent2); border: 1px solid var(--border);
    border-radius: 8px; color: #fff; font-size: 1rem; margin-bottom: 1rem;
    outline: none;
  }
  #login-box input:focus { border-color: var(--accent); }
  #login-btn {
    width: 100%; padding: 0.8rem;
    background: var(--accent); border: none; border-radius: 8px;
    color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  #login-btn:hover { background: #c73650; }
  #login-error { color: var(--accent); font-size: 0.85rem; margin-top: 0.8rem; min-height: 1.2em; }

  /* DASHBOARD */
  #dashboard { display: none; }

  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 1.1rem; color: var(--accent); }
  header span { font-size: 0.8rem; color: var(--text-muted); }
  #logout-btn {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem;
  }
  #logout-btn:hover { border-color: var(--accent); color: var(--accent); }

  .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

  /* FILTRES */
  .filters {
    display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 2rem; align-items: flex-end;
  }
  .filters label { display: block; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.3rem; }
  .filters select, .filters input {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 0.5rem 0.8rem; border-radius: 8px; font-size: 0.9rem;
    outline: none;
  }
  .filters select:focus, .filters input:focus { border-color: var(--accent); }
  #refresh-btn {
    padding: 0.55rem 1.2rem;
    background: var(--accent); border: none; border-radius: 8px;
    color: #fff; font-size: 0.9rem; cursor: pointer; font-weight: 600;
  }

  /* STATS CARDS */
  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 1rem; margin-bottom: 2rem;
  }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 1.2rem; text-align: center;
  }
  .stat-card .val { font-size: 2rem; font-weight: 700; color: var(--accent); }
  .stat-card .lbl { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.3rem; text-transform: uppercase; }

  /* ONGLETS */
  .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
  .tab-btn {
    padding: 0.5rem 1.2rem; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text-muted); cursor: pointer; font-size: 0.9rem;
    transition: all 0.15s;
  }
  .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  /* TABLES */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th {
    background: var(--accent2); color: var(--text); text-align: left;
    padding: 0.7rem 1rem; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
  }
  td { padding: 0.7rem 1rem; border-bottom: 1px solid #1a2a40; vertical-align: middle; }
  tr:hover td { background: #1a2a40; }
  .badge {
    display: inline-block; padding: 0.2rem 0.6rem; border-radius: 20px;
    font-size: 0.75rem; font-weight: 600;
  }
  .badge-green { background: #1a3a1a; color: var(--green); }
  .badge-yellow { background: #3a2a00; color: var(--yellow); }
  .badge-red { background: #3a0f1a; color: var(--red); }

  .pct-bar { width: 80px; height: 6px; background: #2a2a3a; border-radius: 3px; display: inline-block; vertical-align: middle; margin-left: 0.4rem; }
  .pct-fill { height: 100%; border-radius: 3px; }

  /* ELEVE DETAIL */
  #eleve-detail { display: none; }
  #eleve-detail h3 { color: var(--accent); margin-bottom: 1rem; }
  #back-btn {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
    margin-bottom: 1rem;
  }
  #back-btn:hover { border-color: var(--accent); color: var(--accent); }

  .loading { text-align: center; color: var(--text-muted); padding: 3rem; font-size: 1rem; }
  .empty { text-align: center; color: var(--text-muted); padding: 2rem; font-style: italic; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div id="login-box">
    <h1>🏫 Dashboard Prof</h1>
    <p>Activités Mentales · Lycée Denis Diderot</p>
    <input type="password" id="mdp-input" placeholder="Mot de passe" />
    <button id="login-btn">Accéder →</button>
    <p id="login-error"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header>
    <div>
      <h1>📊 Activités Mentales — Suivi classe</h1>
    </div>
    <div style="display:flex;gap:1rem;align-items:center;">
      <span id="header-info"></span>
      <button id="logout-btn">Déconnexion</button>
    </div>
  </header>

  <div class="container">

    <!-- Filtres -->
    <div class="filters">
      <div>
        <label>Classe</label>
        <select id="filter-classe"><option value="">Toutes</option></select>
      </div>
      <div>
        <label>Exercice</label>
        <select id="filter-exercice"><option value="">Tous</option></select>
      </div>
      <div>
        <label>Depuis</label>
        <input type="date" id="filter-date" />
      </div>
      <button id="refresh-btn">↻ Actualiser</button>
    </div>

    <!-- Stats globales -->
    <div class="stats-grid">
      <div class="stat-card"><div class="val" id="stat-eleves">—</div><div class="lbl">Élèves actifs</div></div>
      <div class="stat-card"><div class="val" id="stat-sessions">—</div><div class="lbl">Séries jouées</div></div>
      <div class="stat-card"><div class="val" id="stat-moy">—</div><div class="lbl">Score moyen</div></div>
      <div class="stat-card"><div class="val" id="stat-today">—</div><div class="lbl">Séries aujourd'hui</div></div>
    </div>

    <!-- Onglets -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="eleves">Par élève</button>
      <button class="tab-btn" data-tab="sessions">Dernières séries</button>
      <button class="tab-btn" data-tab="exercices">Par exercice</button>
    </div>

    <!-- Tab : par élève -->
    <div id="tab-eleves" class="tab-content">
      <div id="eleve-list">
        <div class="loading">Chargement…</div>
      </div>
      <div id="eleve-detail">
        <button id="back-btn">← Retour</button>
        <h3 id="detail-title"></h3>
        <div id="detail-content"></div>
      </div>
    </div>

    <!-- Tab : dernières séries -->
    <div id="tab-sessions" class="tab-content" style="display:none;">
      <div id="sessions-content"><div class="loading">Chargement…</div></div>
    </div>

    <!-- Tab : par exercice -->
    <div id="tab-exercices" class="tab-content" style="display:none;">
      <div id="exercices-content"><div class="loading">Chargement…</div></div>
    </div>

  </div>
</div>

<script>
// ============================================
// CONFIG — même valeurs que backend.js
// ============================================
const SUPABASE_URL     = 'https://hxfdlujpedxuumqfewvn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4ZmRsdWpwZWR4dXVtcWZld3ZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMjcyMzAsImV4cCI6MjA5NzcwMzIzMH0.mM0xBhLGWG3vDgE06bEla8b4BhH7v6dvZ-BWn4ZOP0Q';
const PROF_PASSWORD    = 'Diderot2026';

// ============================================
// AUTH
// ============================================
let isAuth = sessionStorage.getItem('am_prof') === '1';

document.getElementById('login-btn').addEventListener('click', () => {
  const val = document.getElementById('mdp-input').value;
  if (val === PROF_PASSWORD) {
    sessionStorage.setItem('am_prof', '1');
    isAuth = true;
    showDashboard();
  } else {
    document.getElementById('login-error').textContent = 'Mot de passe incorrect.';
  }
});
document.getElementById('mdp-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('login-btn').click();
});
document.getElementById('logout-btn').addEventListener('click', () => {
  sessionStorage.removeItem('am_prof');
  location.reload();
});

if (isAuth) showDashboard();

function showDashboard() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadAll();
}

// ============================================
// SUPABASE QUERY
// ============================================
async function sb(table, params = '') {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}${params}`, {
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
    }
  });
  return res.json();
}

// ============================================
// DATA
// ============================================
let allData = { sessions: [], eleves: [], classes: [] };

async function loadAll() {
  // Chargement parallèle
  const [sessions, eleves, classes] = await Promise.all([
    sb('vue_dashboard'),
    sb('eleves', '?select=id,prenom,classe_id'),
    sb('classes', '?select=id,code,nom')
  ]);
  allData = { sessions, eleves, classes };

  populateFilters();
  renderAll();
}

function populateFilters() {
  const classes = [...new Set(allData.sessions.map(s => s.classe))].filter(Boolean);
  const exercices = [...new Set(allData.sessions.map(s => s.exercice))].filter(Boolean);

  const selC = document.getElementById('filter-classe');
  selC.innerHTML = '<option value="">Toutes</option>' + classes.map(c => `<option>${c}</option>`).join('');

  const selE = document.getElementById('filter-exercice');
  selE.innerHTML = '<option value="">Tous</option>' + exercices.map(e => `<option>${e}</option>`).join('');
}

function getFiltered() {
  let data = [...allData.sessions];
  const classe   = document.getElementById('filter-classe').value;
  const exercice = document.getElementById('filter-exercice').value;
  const date     = document.getElementById('filter-date').value;

  if (classe)   data = data.filter(s => s.classe === classe);
  if (exercice) data = data.filter(s => s.exercice === exercice);
  if (date)     data = data.filter(s => s.played_at >= date);
  return data;
}

function renderAll() {
  const data = getFiltered();
  renderStats(data);
  renderElevesTab(data);
  renderSessionsTab(data);
  renderExercicesTab(data);
}

document.getElementById('refresh-btn').addEventListener('click', loadAll);

// ============================================
// STATS GLOBALES
// ============================================
function renderStats(data) {
  const eleves = new Set(data.map(s => s.prenom));
  const moy = data.length ? Math.round(data.reduce((a, b) => a + b.pourcentage, 0) / data.length) : 0;
  const today = new Date().toISOString().slice(0, 10);
  const todaySessions = data.filter(s => s.played_at && s.played_at.startsWith(today)).length;

  document.getElementById('stat-eleves').textContent = eleves.size;
  document.getElementById('stat-sessions').textContent = data.length;
  document.getElementById('stat-moy').textContent = moy + '%';
  document.getElementById('stat-today').textContent = todaySessions;
}

// ============================================
// ONGLETS
// ============================================
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).style.display = 'block';
    showEleveList(); // reset detail si on change d'onglet
  });
});

// ============================================
// TAB : PAR ÉLÈVE
// ============================================
function renderElevesTab(data) {
  // Agréger par élève
  const map = {};
  data.forEach(s => {
    if (!map[s.prenom]) map[s.prenom] = { prenom: s.prenom, classe: s.classe, sessions: [], pcts: [] };
    map[s.prenom].sessions.push(s);
    map[s.prenom].pcts.push(s.pourcentage);
  });

  const eleves = Object.values(map).sort((a, b) => a.prenom.localeCompare(b.prenom));

  if (eleves.length === 0) {
    document.getElementById('eleve-list').innerHTML = '<div class="empty">Aucune donnée pour ces filtres.</div>';
    return;
  }

  let html = `<div class="table-wrap"><table>
    <thead><tr>
      <th>Élève</th><th>Classe</th><th>Séries</th><th>Score moyen</th><th>Dernière activité</th>
    </tr></thead><tbody>`;

  eleves.forEach(e => {
    const moy = Math.round(e.pcts.reduce((a, b) => a + b, 0) / e.pcts.length);
    const last = e.sessions.sort((a, b) => b.played_at.localeCompare(a.played_at))[0];
    const lastDate = last ? new Date(last.played_at).toLocaleDateString('fr-FR') : '—';
    const badge = moy >= 70 ? 'badge-green' : moy >= 40 ? 'badge-yellow' : 'badge-red';

    html += `<tr style="cursor:pointer" onclick="showEleveDetail('${e.prenom}', '${e.classe}')">
      <td><strong>${e.prenom}</strong></td>
      <td>${e.classe || '—'}</td>
      <td>${e.sessions.length}</td>
      <td>
        <span class="badge ${badge}">${moy}%</span>
        <span class="pct-bar"><span class="pct-fill" style="width:${moy}%;background:${moy>=70?'#4caf50':moy>=40?'#ffb300':'#e94560'}"></span></span>
      </td>
      <td>${lastDate}</td>
    </tr>`;
  });

  html += '</tbody></table></div>';
  document.getElementById('eleve-list').innerHTML = html;
}

function showEleveList() {
  document.getElementById('eleve-list').style.display = 'block';
  document.getElementById('eleve-detail').style.display = 'none';
}

function showEleveDetail(prenom, classe) {
  document.getElementById('eleve-list').style.display = 'none';
  const detail = document.getElementById('eleve-detail');
  detail.style.display = 'block';
  document.getElementById('detail-title').textContent = `${prenom} — ${classe}`;

  const sessions = allData.sessions
    .filter(s => s.prenom === prenom && s.classe === classe)
    .sort((a, b) => b.played_at.localeCompare(a.played_at));

  if (sessions.length === 0) {
    document.getElementById('detail-content').innerHTML = '<div class="empty">Aucune session.</div>';
    return;
  }

  let html = `<div class="table-wrap"><table>
    <thead><tr><th>Date</th><th>Exercice</th><th>Score</th><th>%</th><th>Durée</th></tr></thead><tbody>`;

  sessions.forEach(s => {
    const date = new Date(s.played_at).toLocaleString('fr-FR');
    const badge = s.pourcentage >= 70 ? 'badge-green' : s.pourcentage >= 40 ? 'badge-yellow' : 'badge-red';
    const duree = s.duree_totale_ms ? Math.round(s.duree_totale_ms / 1000) + 's' : '—';
    html += `<tr>
      <td>${date}</td>
      <td>${s.exercice}</td>
      <td>${s.score}/${s.nb_questions}</td>
      <td><span class="badge ${badge}">${s.pourcentage}%</span></td>
      <td>${duree}</td>
    </tr>`;
  });

  html += '</tbody></table></div>';
  document.getElementById('detail-content').innerHTML = html;
}

document.getElementById('back-btn').addEventListener('click', showEleveList);

// ============================================
// TAB : DERNIÈRES SÉRIES
// ============================================
function renderSessionsTab(data) {
  const recent = [...data].sort((a, b) => b.played_at.localeCompare(a.played_at)).slice(0, 50);

  if (recent.length === 0) {
    document.getElementById('sessions-content').innerHTML = '<div class="empty">Aucune session.</div>';
    return;
  }

  let html = `<div class="table-wrap"><table>
    <thead><tr><th>Date</th><th>Élève</th><th>Classe</th><th>Exercice</th><th>Score</th><th>%</th></tr></thead><tbody>`;

  recent.forEach(s => {
    const date = new Date(s.played_at).toLocaleString('fr-FR');
    const badge = s.pourcentage >= 70 ? 'badge-green' : s.pourcentage >= 40 ? 'badge-yellow' : 'badge-red';
    html += `<tr>
      <td>${date}</td>
      <td>${s.prenom}</td>
      <td>${s.classe}</td>
      <td>${s.exercice}</td>
      <td>${s.score}/${s.nb_questions}</td>
      <td><span class="badge ${badge}">${s.pourcentage}%</span></td>
    </tr>`;
  });

  html += '</tbody></table></div>';
  document.getElementById('sessions-content').innerHTML = html;
}

// ============================================
// TAB : PAR EXERCICE
// ============================================
function renderExercicesTab(data) {
  const map = {};
  data.forEach(s => {
    if (!map[s.exercice]) map[s.exercice] = { exercice: s.exercice, sessions: 0, pcts: [] };
    map[s.exercice].sessions++;
    map[s.exercice].pcts.push(s.pourcentage);
  });

  const exos = Object.values(map).sort((a, b) => b.sessions - a.sessions);

  if (exos.length === 0) {
    document.getElementById('exercices-content').innerHTML = '<div class="empty">Aucune donnée.</div>';
    return;
  }

  let html = `<div class="table-wrap"><table>
    <thead><tr><th>Exercice</th><th>Séries jouées</th><th>Score moyen</th><th>Min</th><th>Max</th></tr></thead><tbody>`;

  exos.forEach(e => {
    const moy = Math.round(e.pcts.reduce((a, b) => a + b, 0) / e.pcts.length);
    const min = Math.min(...e.pcts);
    const max = Math.max(...e.pcts);
    const badge = moy >= 70 ? 'badge-green' : moy >= 40 ? 'badge-yellow' : 'badge-red';

    html += `<tr>
      <td><strong>${e.exercice}</strong></td>
      <td>${e.sessions}</td>
      <td>
        <span class="badge ${badge}">${moy}%</span>
        <span class="pct-bar"><span class="pct-fill" style="width:${moy}%;background:${moy>=70?'#4caf50':moy>=40?'#ffb300':'#e94560'}"></span></span>
      </td>
      <td>${min}%</td>
      <td>${max}%</td>
    </tr>`;
  });

  html += '</tbody></table></div>';
  document.getElementById('exercices-content').innerHTML = html;
}

// Filtres réactifs
['filter-classe','filter-exercice','filter-date'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => { showEleveList(); renderAll(); });
});
</script>
</body>
</html>
